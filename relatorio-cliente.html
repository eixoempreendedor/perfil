function el(t,a,k){ const e=document.createElement(t); a=a||{}; for(const x in a){ const v=a[x]; if(x==="class")e.className=v; else if(x==="html")e.innerHTML=v; else if(x.slice(0,2)==="on"&&typeof v==="function")e.addEventListener(x.slice(2),v); else if(typeof v==="boolean"){ if(v)e.setAttribute(x,""); } else if(v!=null)e.setAttribute(x,v); } (k||[]).forEach(c=>{ if(c==null)return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); }); return e; }

function assinatura(primary){
  const idx={D:0,I:1,S:2,C:3}[primary]; let s="";
  for(let i=0;i<4;i++){ const on=i===idx; s+=`<line x1="0" y1="${6+i*9}" x2="${on?110:64}" y2="${6+i*9}" stroke="${on?'#C78F2C':'#7e9b95'}" stroke-width="${on?3:2}"/>`; }
  return `<svg width="120" height="40" viewBox="0 0 120 40" style="display:block;margin:0 auto" aria-label="Eixo">${s}</svg>`;
}
function radarSVG(tr){
  const N=tr.length, cx=300, cy=280, R=175, Rl=192;
  const pt=(i,val)=>{ const a=(i/N*2*Math.PI)-Math.PI/2; const r=R*(Math.max(0,Math.min(100,val))/100); return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  const polyPts=key=> tr.map((x,i)=>pt(i,x[key]).map(n=>n.toFixed(1)).join(",")).join(" ");
  let grid=""; [25,50,75,100].forEach(g=>{ grid+=`<polygon points="${tr.map((x,i)=>pt(i,g).map(n=>n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#ece5d6" stroke-width="1"/>`; });
  let spokes="",labels="",dots="";
  tr.forEach((x,i)=>{ const a=(i/N*2*Math.PI)-Math.PI/2; const [ex,ey]=pt(i,100); spokes+=`<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#f0ead8" stroke-width="1"/>`; const ca=Math.cos(a); const lx=cx+Rl*ca, ly=cy+Rl*Math.sin(a); const anchor=ca>0.15?"start":(ca<-0.15?"end":"middle"); labels+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" font-size="13" font-weight="600" fill="#2b3633" text-anchor="${anchor}" font-family="Open Sans,Arial">${SHORT[x.n]||x.n}</text>`; if(x.m){ const [vx,vy]=pt(i,x.voce); dots+=`<circle cx="${vx.toFixed(1)}" cy="${vy.toFixed(1)}" r="4" fill="#C78F2C" stroke="#fff" stroke-width="1.5"/>`; } });
  const ideal=`<polygon points="${polyPts('ideal')}" fill="rgba(199,143,44,.08)" stroke="#C78F2C" stroke-width="2" stroke-dasharray="5 4"/>`;
  const voce=`<polygon points="${polyPts('voce')}" fill="rgba(15,61,58,.22)" stroke="#0F3D3A" stroke-width="2.4"/>`;
  return `<svg viewBox="0 0 600 560" width="100%" style="width:100%;display:block;margin:0 auto">${grid}${spokes}${ideal}${voce}${dots}${labels}</svg>`;
}

function render(){

  const fortes=tr.slice().sort((a,b)=>b.voce-a.voce).slice(0,4);
  const marcados=tr.filter(x=>x.m).sort((a,b)=>b.gap-a.gap);
  const pool=(marcados.length?marcados:tr.slice().filter(x=>x.gap>0).sort((a,b)=>b.gap-a.gap));
  const foco=pool[0], observar=pool.slice(1,3);
  const aderencia=Math.round(ORDER.reduce((s,f)=>s+Math.min(comb[f],IDEAL[f])/IDEAL[f],0)/4*100);
  const data=hoje();
  const focoMes=(foco.mom.match(/M(\d)/)||[])[1];

  // HERO (capa)
  $.appendChild(el("div",{class:"hero"},[
    el("div",{html:assinatura(primary)}),
    el("div",{class:"wm"},["EIXO EMPREENDEDOR"]),
    el("h1",{},["Perfil Empreendedor Eixo"]),
    el("div",{class:"nome"},[id.cliente||"—"]),
    el("div",{class:"meta"},[(id.empresa?id.empresa+" · ":"")+data]),
    el("div",{class:"badge"},[`${FATOR[primary].nome} ${FATOR[secondary].nome}`]),
  ]));

  // ABERTURA + tensão + AHA + tema
  $.appendChild(el("div",{class:"card"},[
    el("h2",{},[`Olá${id.cliente?(", "+id.cliente.split(" ")[0]):""}!`]),
    el("p",{},["Esse é o seu Perfil Empreendedor — não um teste pra dizer se você tá certo ou errado, mas um espelho de como você toca o seu negócio no dia a dia, e onde tem mais chão pra crescer."]),
    el("p",{},["Cada dono tem o seu jeito; o que muda o jogo é saber qual é o seu e dar o próximo passo a partir dele. O seu jeito é o do ", el("b",{},[FATOR[primary].nome]), ": ", FATOR[primary].txt]),
    el("p",{},["Mas tem uma verdade aqui: às vezes o que te trouxe até aqui — a sua maior força — é o mesmo que começa a te segurar quando a empresa cresce."]),
    el("div",{class:"aha"},[ el("b",{},["Repara nisso: "]), `sua força mais forte hoje é ${fortes[0].n}. É por aí que você abre vantagem — e ninguém nasce pronto no resto; a gente vira no caminho.` ]),
    el("p",{class:"tema"},[`Se este relatório fosse uma frase, seria: o seu mês é sobre ${foco.n.toLowerCase()}.`]),
  ]));

  // RADAR + aderência datada + nível + prova social
  $.appendChild(el("div",{class:"card"},[
    el("h2",{},["O seu mapa"]),
    el("div",{html:radarSVG(tr)}),
    el("div",{class:"leg"},[ el("span",{html:'<i style="border-top:3px solid #0F3D3A"></i>Você'}), el("span",{html:'<i style="border-top:3px dashed #C78F2C"></i>Dono que cresce'}), el("span",{html:'<i style="width:9px;height:9px;border-radius:50%;background:#C78F2C;border-top:0"></i>Foco que você escolheu'}) ]),
    el("div",{class:"adernum"},[`${aderencia}%`]),
    el("div",{class:"nivel"},[nivel(aderencia)]),
    el("p",{class:"muted",style:"text-align:center;margin-top:4px"},[`Sua aderência ao caminho do dono que cresce, medida hoje (${data}). É a sua linha de base — no mês 6 a gente remede neste mesmo mapa e você vê o quanto andou.`]),
    el("p",{class:"muted",style:"text-align:center;font-size:12px"},["Régua calibrada com donos de pequenas e médias empresas do DF e de Goiás."]),
  ]));

  // FORÇAS
  const cf=el("div",{class:"card"}); cf.appendChild(el("h2",{},["Comece pelas suas forças"]));
  cf.appendChild(el("p",{class:"muted"},["O que você já faz bem — é daqui que a gente parte."]));
  fortes.forEach(x=> cf.appendChild(el("div",{class:"forca"},[ el("b",{},[x.n]), " — ", x.por, "." ])));
  $.appendChild(cf);

  // FOCO + virada + ROI + quick-win + 30 dias + semana na Bússola
  const cfoco=el("div",{class:"card"});
  cfoco.appendChild(el("h2",{},["Onde você tem mais a ganhar"]));
  cfoco.appendChild(el("p",{class:"muted"},["Não precisa atacar tudo. Comece por UM — o que mais destrava o resto agora."]));
  cfoco.appendChild(el("div",{class:"foco"},[
    el("span",{class:"pill"},["Seu foco do mês"]),
    el("h3",{},[foco.n]),
    el("p",{},[DESC[foco.n]]),
    el("div",{class:"roi"},[ "Faça a conta comigo: 1 hora sua vale R$ ", el("span",{class:"l"}), ". Hoje a falta de ", foco.n.toLowerCase(), " te custa ~", el("span",{class:"l"}), " horas/semana. São R$ ", el("span",{class:"l"}), "/mês escapando — e é exatamente isso que a gente destrava primeiro." ]),
    el("div",{class:"virada"},["Topa trabalhar ESTE ponto nos próximos 30 dias?"]),
    el("div",{class:"quick"},[ el("b",{},["Comece amanhã de manhã: "]), QUICK[foco.n] ]),
    el("h3",{style:"font-size:14px;color:#0F3D3A"},["E nos próximos 30 dias:"]),
    el("ul",{class:"acoes"}, (ACOES[foco.n]||[]).map(a=>el("li",{},[a]))),
    el("p",{class:"muted"},[`Toda semana isso vira 1 número que você marca na Bússola — e a gente revisa junto. No Eixo 180, é trabalhado em ${foco.mom}.`]),
  ]));
  if(observar.length){ cfoco.appendChild(el("h3",{},["E mais 2 pra observar (depois)"]));
    observar.forEach(x=> cfoco.appendChild(el("div",{class:"obs"},[ el("b",{},[x.n]), " — ", x.por, "." ]))); }
  $.appendChild(cfoco);

  // MINI-MAPA M1->M6
  $.appendChild(el("div",{class:"card"},[
    el("h2",{},["Onde isso entra na sua jornada de 6 meses"]),
    el("div",{class:"mapa6"}, FASES.map(f=> el("div",{class:"et"+(focoMes&&f[0]==="M"+focoMes?" on":"")},[ el("div",{},[f[0]]), el("div",{},[f[1]]) ]))),
    el("p",{class:"muted"},["Você está no começo (M1). O seu foco se encaixa no mês marcado — por isso ele vem agora, e o resto a gente trabalha no tempo certo."]),
  ]));

  // PACTO + próximo encontro + caixa destravar
  $.appendChild(el("div",{class:"card"},[
    el("h2",{},["Meu compromisso"]),
    el("p",{},["Topo. Eu, ", el("b",{},[id.cliente||"_______________"]), ", escolho trabalhar ", el("b",{},[foco.n]), " nos próximos 30 dias."]),
    el("div",{class:"pacto"},[
      el("p",{style:"margin:0"},["Meu primeiro passo, até ___ /___ /______, é:"]),
      el("div",{class:"linha"}), el("div",{class:"linha"}),
      el("p",{style:"margin-top:12px"},[el("b",{},["Nosso próximo encontro:"]), " ___ /___ às ___ h."]),
      el("p",{class:"muted",style:"margin-top:12px"},["O que eu quero destravar primeiro com o Luiz:"]),
      el("div",{class:"linha"}), el("div",{class:"linha"}),
      el("p",{style:"margin-top:14px"},["Assinatura:"]), el("div",{class:"linha"}),
    ]),
  ]));

  // MAPA DOS 24
  const cdet=el("div",{class:"card"});
  cdet.appendChild(el("h2",{},["Seu mapa completo — os 24 comportamentos"]));
  cdet.appendChild(el("p",{class:"muted"},["O que cada um significa, e onde você está em relação ao dono que cresce (você / dono que cresce). É o panorama — o foco está lá em cima."]));
  ORDER.forEach(f=>{
    const bloco=el("div",{class:"fbloco",style:`border-left-color:${FCOR[f]}`});
    bloco.appendChild(el("h3",{style:`color:${FCOR[f]}`},[FATOR[f].nome]));
    tr.filter(x=>x.f===f).forEach(x=>{
      const c = x.gap>20 ? "#b87a1e" : (x.gap>0 ? "#8a5a12" : "var(--verde)");
      bloco.appendChild(el("div",{style:"margin:6px 0 8px"},[
        el("div",{class:"cmp"},[ el("b",{},[x.n, x.m?el("span",{style:"color:#C78F2C"},["  ★"]):null]), el("span",{style:`white-space:nowrap;font-size:12px;font-weight:700;color:${c}`},[`${x.voce} / ${x.ideal}`]) ]),
        el("p",{class:"muted",style:"margin:3px 0 0"},[DESC[x.n]||""]),
      ]));
    });
    cdet.appendChild(bloco);
  });
  $.appendChild(cdet);

  // AMBIENTE
  $.appendChild(el("div",{class:"card"},[ el("h2",{},["Onde você rende mais"]), el("p",{},[AMBIENTE[primary]]) ]));

  // FECHAMENTO
  $.appendChild(el("div",{class:"card"},[
    el("h2",{},["Por onde começar"]),
    el("p",{},["Não precisa virar outra pessoa, nem mudar tudo de uma vez. Escolhe ", el("b",{},["o seu foco do mês"]), " e dá o primeiro passo essa semana."]),
    el("p",{},["E não se cobre demais: isso não é quem você ", el("b",{},["é"]), " pra sempre — é onde você ", el("b",{},["está"]), " hoje. Comportamento se treina, e a gente mede a sua evolução ao longo dos 6 meses."]),
    el("p",{},[ el("b",{},["Leve este relatório no nosso 1º encontro"]), " — é nele que a gente transforma o seu foco em plano. ", el("b",{},["A gente caminha junto, dono pra dono."]) ]),
    el("div",{class:"noprint",style:"margin-top:12px"},[ el("button",{class:"btn",onclick:()=>window.print()},["Imprimir / Salvar PDF"]) ]),
  ]));
}
render();
</script>
</body>
</html>
